[project]
name = "evalio"
authors = [{ name = "Easton Potokar", email = "contagon6@gmail.com" }]
maintainers = [{ name = "Easton Potokar", email = "contagon6@gmail.com" }]
version = "0.6.1"
description = "Evaluate Lidar-Inertial Odometry on public datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=4.0",
    "asteval>=1.0.8",
    "awscli>=1.46.0",
    "distinctipy>=1.3.4",
    "gdown>=6.1.0",
    "joblib>=1.5.2",
    "numpy",
    "polars>=1.43.2",
    "pyyaml>=6.0",
    "rapidfuzz>=3.12.2",
    "rosbags>=0.11.3",
    "tqdm>=4.67",
]
keywords = [
    "lidar",
    "odometry",
    "evaluation",
    "inertial",
    "dataset",
    "robotics",
]
license = { file = "LICENSE.txt" }

[project.optional-dependencies]
vis = ["rerun-sdk>=0.35"]

[build-system]
requires = ["scikit-build-core>=1.0", "nanobind==2.13.0", "numpy"]
build-backend = "scikit_build_core.build"

[project.scripts]
evalio = "evalio.cli:app.meta"

# -------------- Tools -------------- #
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "cpp/**/*.{h,c,hpp,cpp}" },
    { file = "python/**/*.{cpp,py}" },
    { file = "CMakeLists.txt" },
]

# building
[tool.scikit-build]
minimum-version = "0.12"
build-dir = "build/{wheel_tag}"
sdist.include = ["cpp/bindings/pipelines-src/*"]

[tool.scikit-build.cmake.define]
EVALIO_BUILD_PYTHON = true
CMAKE_BUILD_TYPE = "RelWithDebInfo"
VCPKG_INSTALLED_DIR = "./.vcpkg_installed"
# VCPKG_INSTALL_OPTIONS = "--debug"

[tool.cibuildwheel]
skip = [
    "cp3??t-*",           # skip free-threaded builds 
    "*musllinux*",        # skip musl builds 
    "*win32",             # skip 32-bit windows
    "*macosx_x86_64",     # skip intel mac builds
    "*macosx_universal2", # skip universal2 mac builds
]
test-requires = "pytest>=8.3.5 scipy>=1.15.2"
test-command = "evalio ls pipelines && pytest {project}/tests"
build-verbosity = 1

# tbb requires at least 10.13, pcl 10.15. We bump to 11 for simplicity.
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11"

# local development
[dependency-groups]
dev = [
    "cmake<4.0.0",
    "compdb>=0.2.0",
    "ruff>=0.16",
    "types-pyyaml>=6.0.12.20240917",
    "types-tabulate>=0.9.0.20240106",
    "types-tqdm>=4.66.0.20240417",
    "pytest>=8.3.5",
    "mkdocstrings[python]>=0.29.1",
    "zensical",
    "mike @ git+https://github.com/squidfunk/mike.git",
    "joblib-stubs>=1.5.2.0.20250831",
    "scipy>=1.16.2",
    "scipy-stubs>=1.16.2.4",
    "pyrefly>=1.2.0",
]

[tool.ruff]
exclude = ["cpp/**/*"]
lint.ignore = ["E731", "UP045"]

[tool.ruff.format]
# https://docs.astral.sh/ruff/configuration/
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["python", "tests"]
# Eventually would like to fix all the errors to switch to "strict"
typeCheckingMode = "strict"
stubPath = "python/typings"
reportPrivateUsage = "none"
reportConstantRedefinition = "none"
reportUnnecessaryIsInstance = "none"

[tool.pyrefly]
include = ["python", "tests"]
